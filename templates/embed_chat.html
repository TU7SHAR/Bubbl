<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotFactory Chat Widget</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}" />

    <style>
      body, html {
        background: transparent !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: "Outfit", sans-serif !important; 
      }

      #chat-widget-container {
        bottom: 10px !important;
        right: 10px !important;
      }

      /* Use the self-playing animated WebP for the mascot in the embed.
         It plays natively on any device/host (no giant filmstrip, no JS
         needed) — so the sprite reliably shows + animates on third-party
         sites. */
      #bot-sprite {
        width: 200px !important;
        height: 110px !important;
        background-image: url("{{ request.host_url }}static/images/sprite-mobile.webp") !important;
        background-size: contain !important;
        background-repeat: no-repeat !important;
        background-position: center bottom !important;
        transform: none !important;
        margin-bottom: 2px !important;
      }
      /* Hide the invisible hit-area (pill is the clicker), and hide the
         sprite when the chat is open so it doesn't float in the tall iframe. */
      #sprite-hit-area {
        display: none !important;
      }
      #sprite-ask-container.chat-open {
        display: none !important;
      }
    </style>
  </head>
  <body>
    {% include 'chat.html' %}
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
      window.EMBEDDED_BOT_ID = "{{ bot.id }}";
      window.LEAD_TIMING = "{{ bot.lead_capture_timing }}";
    </script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    <!-- No sprite.js in the embed: the mascot is a self-playing animated
         WebP (set in the CSS above), which needs no JS and works on every
         host/device. sprite.js would fight it by moving the background. -->
  </body>
</html>
