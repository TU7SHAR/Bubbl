<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block page_title %}Admin{% endblock %} | bubbl.ooo Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {% block head %}{% endblock %}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: rgba(148,163,184,0.1);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #E8722A;
      --accent-hover: #f2943b;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #8b5cf6;
      --yellow: #f59e0b;
      --grid-color: rgba(148,163,184,0.1);
      --tick-color: #94a3b8;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    /* Header */
    .sa-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--card-border);
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
    }
    .sa-header-brand {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .sa-header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .sa-header-right a {
      color: var(--text-muted);
      font-weight: 500;
      transition: color 0.15s;
    }
    .sa-header-right a:hover {
      color: var(--accent);
    }
    #ist-clock {
      font-variant-numeric: tabular-nums;
    }

    /* Horizontal tab nav */
    .sa-nav {
      display: flex;
      gap: 4px;
      padding: 12px 24px;
      overflow-x: auto;
      border-bottom: 1px solid var(--card-border);
      background: var(--card-bg);
    }
    .sa-nav::-webkit-scrollbar { display: none; }
    .sa-nav a {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      border-radius: 8px;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .sa-nav a:hover {
      background: rgba(232,114,42,0.1);
      color: var(--accent);
    }
    .sa-nav a.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* Main content area */
    .sa-main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Stat cards grid */
    .sa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    @media (max-width: 640px) {
      .sa-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .sa-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
    }
    .sa-card-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .sa-card-value {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
    }

    /* Tables */
    .sa-table-wrap {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .sa-table-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sa-table-header h3 {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      color: var(--text);
    }
    .sa-table-scroll {
      overflow-x: auto;
    }
    table.sa-table {
      width: 100%;
      border-collapse: collapse;
    }
    .sa-table th {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: left;
      border-bottom: 1px solid var(--card-border);
    }
    .sa-table td {
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text);
      border-bottom: 1px solid var(--card-border);
    }
    .sa-table tr:hover td {
      background: rgba(232,114,42,0.04);
    }
    .sa-table tr:last-child td {
      border-bottom: none;
    }

    /* Badges */
    .sa-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .sa-badge-orange { background: rgba(232,114,42,0.15); color: #E8722A; }
    .sa-badge-green { background: rgba(16,185,129,0.15); color: var(--green); }
    .sa-badge-red { background: rgba(239,68,68,0.15); color: var(--red); }
    .sa-badge-blue { background: rgba(59,130,246,0.15); color: var(--blue); }
    .sa-badge-purple { background: rgba(139,92,246,0.15); color: var(--purple); }
    .sa-badge-gray { background: rgba(148,163,184,0.1); color: var(--text-muted); }
    .sa-badge-yellow { background: rgba(245,158,11,0.15); color: var(--yellow); }

    /* Buttons */
    .sa-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s, color 0.15s;
    }
    .sa-btn-primary { background: var(--accent); color: #fff; }
    .sa-btn-primary:hover { background: var(--accent-hover); }
    .sa-btn-ghost {
      background: rgba(148,163,184,0.08);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }
    .sa-btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .sa-btn-danger { background: rgba(239,68,68,0.12); color: var(--red); }
    .sa-btn-danger:hover { background: rgba(239,68,68,0.2); }
    .sa-btn-success { background: rgba(16,185,129,0.12); color: var(--green); }
    .sa-btn-success:hover { background: rgba(16,185,129,0.2); }

    /* Forms */
    .sa-select, .sa-input {
      padding: 6px 10px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    .sa-select:focus, .sa-input:focus { border-color: var(--accent); }

    /* Filter bar */
    .sa-filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    /* Pagination */
    .sa-pagination {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      padding: 16px 0;
    }
    .sa-pagination a, .sa-pagination span {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }
    .sa-pagination a {
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }
    .sa-pagination a:hover { border-color: var(--accent); color: var(--accent); }
    .sa-pagination .current { background: var(--accent); color: #fff; }

    /* Chat transcript */
    .chat-bubble {
      max-width: 70%;
      padding: 8px 12px;
      border-radius: 12px;
      margin-bottom: 6px;
      font-size: 13px;
      line-height: 1.4;
    }
    .chat-user {
      background: rgba(232,114,42,0.15);
      color: var(--text);
      margin-left: auto;
      border-bottom-right-radius: 3px;
    }
    .chat-bot {
      background: rgba(148,163,184,0.1);
      color: var(--text);
      border-bottom-left-radius: 3px;
    }
    .chat-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Modal */
    .sa-modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .sa-modal-bg.open { display: flex; }
    .sa-modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      max-width: 460px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .sa-modal h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text);
    }
    .sa-modal input, .sa-modal textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
      background: var(--bg);
      color: var(--text);
    }
    .sa-modal input:focus, .sa-modal textarea:focus { border-color: var(--accent); }
    .sa-modal textarea { resize: vertical; min-height: 100px; }
    /* === UNPREFIXED ALIASES (some child templates use these) === */
    .page-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
    .table-wrap { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
    .table-header { padding: 14px 18px; border-bottom: 1px solid var(--card-border); }
    .table-header h3 { font-size: 15px; font-weight: 700; margin: 0; color: var(--text); }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    table th { padding: 10px 14px; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; text-align: left; border-bottom: 1px solid var(--card-border); }
    table td { padding: 12px 14px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--card-border); }
    table tr:hover td { background: rgba(232,114,42,0.04); }
    table tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-green { background: rgba(16,185,129,0.15); color: var(--green); }
    .badge-red { background: rgba(239,68,68,0.15); color: var(--red); }
    .badge-blue { background: rgba(59,130,246,0.15); color: var(--blue); }
    .badge-purple { background: rgba(139,92,246,0.15); color: var(--purple); }
    .badge-gray { background: rgba(148,163,184,0.1); color: var(--text-muted); }
    .badge-yellow { background: rgba(245,158,11,0.15); color: var(--yellow); }
    .btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-outline { background: rgba(148,163,184,0.08); color: var(--text-muted); border: 1px solid var(--card-border); }
    .btn-danger { background: rgba(239,68,68,0.12); color: var(--red); }
    .btn-success { background: rgba(16,185,129,0.12); color: var(--green); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 18px; }
    .card-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
    .card-value { font-size: 24px; font-weight: 800; color: var(--text); }
    .select, .input { padding: 6px 10px; border: 1px solid var(--card-border); border-radius: 8px; font-size: 13px; background: var(--bg); color: var(--text); outline: none; }
    .filter-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .pagination { display: flex; gap: 6px; align-items: center; justify-content: center; padding: 16px 0; }
    .pagination a, .pagination span { padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; text-decoration: none; }
    .pagination a { border: 1px solid var(--card-border); color: var(--text-muted); }
    .pagination .current { background: var(--accent); color: #fff; }
  </style>
</head>
<body>

<!-- Header -->
<header class="sa-header">
  <div class="sa-header-brand">bubbl.ooo Admin</div>
  <div class="sa-header-right">
    <span id="ist-clock"></span>
    <a href="/">Back to App</a>
    <a href="/logout">Logout</a>
  </div>
</header>

<!-- Tab Navigation -->
<nav class="sa-nav">
  <a href="{{ url_for('super_admin_bp.dashboard') }}" class="{% if request.endpoint == 'super_admin_bp.dashboard' %}active{% endif %}">Overview</a>
  <a href="{{ url_for('super_admin_bp.users_page') }}" class="{% if 'users' in (request.endpoint or '') %}active{% endif %}">Users</a>
  <a href="{{ url_for('super_admin_bp.bots_page') }}" class="{% if 'bots' in (request.endpoint or '') %}active{% endif %}">Bots</a>
  <a href="{{ url_for('super_admin_bp.billing_page') }}" class="{% if 'billing' in (request.endpoint or '') %}active{% endif %}">Billing</a>
  <a href="{{ url_for('super_admin_bp.leads_page') }}" class="{% if 'leads' in (request.endpoint or '') %}active{% endif %}">Leads</a>
  <a href="{{ url_for('super_admin_bp.conversations_page') }}" class="{% if 'conversation' in (request.endpoint or '') %}active{% endif %}">Chats</a>
  <a href="{{ url_for('super_admin_bp.scrapes_page') }}" class="{% if 'scrapes' in (request.endpoint or '') %}active{% endif %}">Scrapes</a>
</nav>

<!-- Main Content -->
<main class="sa-main">
  {% block content %}{% endblock %}
  {% block admin_content %}{% endblock %}
</main>

<!-- Modal -->
<div class="sa-modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sa-modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// Modal system
function openModal(t, h) {
  document.getElementById('modal-title').textContent = t;
  document.getElementById('modal-body').innerHTML = h;
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

// IST Clock
function updateClock() {
  var now = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  document.getElementById('ist-clock').textContent = now + ' IST';
}
updateClock();
setInterval(updateClock, 1000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
