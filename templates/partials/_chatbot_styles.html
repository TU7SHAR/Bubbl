<style>
/* ============================================================
   BASE STYLES
   ============================================================ */
.cb-container { max-width: 1200px; margin: 0 auto; padding-top: 20px; }
.cb-header { font-size: 32px; color: var(--text-primary); margin-bottom: 30px; }
.cb-layout { display: flex; gap: 40px; align-items: flex-start; }
.cb-sidebar { width: 220px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 100px; }
.cb-tab { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--text-secondary); background: transparent; border: 1px solid transparent; cursor: pointer; text-align: left; font-family: 'Outfit', sans-serif; transition: all 0.2s ease; }
.cb-tab:hover { background: rgba(232, 114, 42, 0.05); color: var(--text-primary); }
.cb-tab.active { background: rgba(232, 114, 42, 0.1); color: var(--orange); border: 1px solid rgba(232, 114, 42, 0.2); font-weight: 700; }
.cb-content { flex: 1; min-height: 500px; }
.cb-content-title { font-size: 24px; color: var(--text-primary); margin-top: 0; margin-bottom: 8px; }
.cb-content-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; border-bottom: 2px solid rgba(232, 114, 42, 0.15); padding-bottom: 12px; }
.cb-pane { display: none; animation: fadeIn 0.3s ease; }
.cb-pane.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.cb-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.qs-label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }
.qs-input-wrapper { display: flex; align-items: stretch; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; margin-bottom: 20px; background: #fff; transition: border-color 0.2s; }
.qs-input-wrapper:focus-within { border-color: var(--orange); }
.qs-prefix { background: #f9fafb; padding: 12px 16px; border-right: 1px solid rgba(0,0,0,0.1); color: #6b7280; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.qs-input { border: none; padding: 12px 16px; width: 100%; font-family: inherit; font-size: 14px; color: #111827; outline: none; }
.source-list { border-top: 1px solid rgba(0,0,0,0.05); margin-top: 20px; margin-bottom: 30px; }
.source-item { border-bottom: 1px solid rgba(0,0,0,0.05); }
.source-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; cursor: pointer; user-select: none; transition: background 0.2s; }
.source-header:hover .source-title-group { color: var(--orange); }
.source-title-group { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; color: #111827; transition: color 0.2s; }
.source-icon { color: #6b7280; display: flex; align-items: center; }
.source-action-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #e5e7eb; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 300; color: #6b7280; transition: all 0.2s; }
.source-header:hover .source-action-btn { border-color: #d1d5db; background: #f9fafb; color: #111827; }
.btn-train { background: #000; color: #fff; border: none; border-radius: 8px; padding: 12px 28px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-family: inherit; display: inline-block; }
.btn-train:hover { background: #1f2937; }
.f-graphic-container { width: 100%; height: 300px; background: #fdfdfd; border-radius: 16px; border: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.f-grid { position: absolute; inset: 0; background-size: 20px 20px; background-image: radial-gradient(circle, #e5e7eb 1px, transparent 1px); opacity: 0.5; }
.terminal-container { width: 100%; max-width: 650px; height: 450px; background: #0f172a; border-radius: 12px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); border: 1px solid #334155; overflow: hidden; display: flex; flex-direction: column; transition: all 0.3s ease; }
.terminal-container.maximized { max-width: 90vw; height: 80vh; margin-top: 80px; }
.terminal-header { background: #1e293b; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
.term-dot-group { display: flex; gap: 8px; align-items: center; }
.term-dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; transition: opacity 0.2s; }
.term-dot:hover { opacity: 0.7; }
.term-dot.r { background: #ef4444; } .term-dot.y { background: #f59e0b; } .term-dot.g { background: #10b981; }
.terminal-body { padding: 20px; flex: 1; overflow-y: auto; font-family: 'Fira Code', 'Courier New', Courier, monospace; font-size: 13px; color: #38bdf8; line-height: 1.6; white-space: pre-wrap; }
.cb-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 9999; opacity: 0; transition: opacity 0.2s ease; padding: 20px; }
.cb-modal-overlay.active { display: flex; opacity: 1; }
.cb-modal-container { background: #fff; width: 100%; max-width: 850px; border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); display: flex; flex-direction: column; max-height: 85vh; overflow: hidden; transform: translateY(20px); transition: transform 0.2s ease; position: relative; }
.cb-modal-overlay.active .cb-modal-container { transform: translateY(0); }
.cb-modal-close-top { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 24px; color: #6b7280; cursor: pointer; transition: color 0.2s; z-index: 50; }
.cb-modal-close-top:hover { color: #111827; }
.modal-inner-wrapper { display: none; flex-direction: column; flex: 1; overflow: hidden; width: 100%; }
.cb-modal-header { padding: 40px 40px 20px 40px; display: flex; justify-content: space-between; align-items: flex-start; flex-shrink: 0; }
.cb-modal-header h2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; color: #111827; margin: 0 0 8px 0; }
.cb-modal-header p { color: #4b5563; font-size: 14px; margin: 0; }
.cb-modal-body { padding: 0 40px 20px 40px; overflow-y: auto; flex: 1; min-height: 0; }
.cb-box { border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; overflow: hidden; flex-shrink: 0; }
.cb-box-header { padding: 16px 20px; font-size: 15px; font-weight: 600; color: #111827; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
.cb-box-content { padding: 20px; }
.cb-dropzone { border: 2px dashed #e5e7eb; border-radius: 12px; padding: 60px 20px; text-align: center; background: #fff; cursor: pointer; transition: all 0.2s ease; display: block; }
.cb-dropzone:hover { border-color: var(--orange); background: #fdfaf8; }
.cb-modal-footer { display: flex; justify-content: flex-end; padding: 20px 40px 40px 40px; flex-shrink: 0; background: #fff; border-top: 1px solid rgba(0,0,0,0.05); }
.btn-modal-action { background: #6b7280; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
.btn-modal-action.active { background: var(--orange); }
.chatbase-file-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 10px; border-bottom: 1px solid #f3f4f6; transition: background 0.2s; width: 100%; box-sizing: border-box; }
.chatbase-file-row:hover { background: #f9fafb; }
.file-badge-new { background: #ecfdf5; color: #10b981; border: 1px solid #a7f3d0; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 12px; flex-shrink: 0; margin-left: 8px; }
.ui-layout-split { display: flex; gap: 40px; flex-wrap: wrap; }
.ui-settings-col { flex: 1; min-width: 300px; }
.ui-preview-col { flex: 1; min-width: 300px; display: flex; justify-content: center; align-items: center; background-color: #fdfaf8; background-image: radial-gradient(circle at 10% 20%, rgba(232, 114, 42, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%); border: 1px dashed rgba(232, 114, 42, 0.3); border-radius: 20px; padding: 20px; }
.mock-chat-widget { width: 100%; max-width: 350px; background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid rgba(0,0,0,0.05); transition: background 0.3s, border-color 0.3s; }
.mock-chat-header { padding: 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(0,0,0,0.05); transition: border-color 0.3s; }
.mock-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--orange); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; font-family: 'Bricolage Grotesque', sans-serif; overflow: hidden; }
.mock-chat-body { padding: 20px; height: 250px; background: #f9fafb; display: flex; flex-direction: column; gap: 12px; transition: background 0.3s; }
.mock-bubble-in { background: #e5e7eb; color: #111827; padding: 10px 14px; border-radius: 12px 12px 12px 2px; font-size: 13px; max-width: 80%; align-self: flex-start; }
.mock-bubble-out { background: var(--orange); color: #fff; padding: 10px 14px; border-radius: 12px 12px 2px 12px; font-size: 13px; max-width: 80%; align-self: flex-end; }
.mock-chat-footer { padding: 12px 16px; border-top: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; }
.mock-input { width: 100%; background: #f3f4f6; border: none; padding: 10px 12px; border-radius: 50px; font-size: 13px; color: #9ca3af; }
.cb-bottom-bar { margin-top: 40px; padding-top: 20px; border-top: 2px solid rgba(232, 114, 42, 0.15); display: flex; justify-content: flex-end; align-items: center; }

/* --- CUSTOM PRETTY DROPDOWN --- */
.pretty-dropdown { position: relative; width: 100%; user-select: none; }
.pd-selected { background: #fff; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 14px; color: #111827; transition: all 0.2s; }
.pd-selected:hover { border-color: var(--orange); }
.pd-options { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; margin-top: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 50; display: none; max-height: 280px; overflow-y: auto; }
.pd-options.show { display: block; animation: pdFadeIn 0.2s ease; }
@keyframes pdFadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
.pd-option { padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.05); cursor: pointer; transition: background 0.2s; }
.pd-option:last-child { border-bottom: none; }
.pd-option:hover { background: rgba(232, 114, 42, 0.05); }
.pd-option strong { display: block; font-size: 14px; color: #111827; margin-bottom: 2px; }
.pd-option span { display: block; font-size: 12px; color: #6b7280; }

.pipeline-card-body { padding: 40px; }
.pipeline-col { flex: 1; min-width: 320px; }


/* ============================================================
   UPDATED MOBILE RESPONSIVE
   ============================================================ */
@media (max-width: 768px) {

  /* ── 1. CRITICAL OVERFLOW FIXES ── */
  .cb-container, .cb-container *, .lg, .lg-c {
    box-sizing: border-box !important;
    max-width: 100% !important;
  }

  /* ── 2. PADDING FIX (Centers the white card) ── */
  .cb-container {
    padding-top: 0 !important;
    padding-left: 0 !important; /* Removed extra left padding */
    padding-right: 0 !important;
    width: 100%;
    overflow-x: hidden; 
  }

  /* ── 3. SMALLER, CENTERED HEADINGS ── */
  .cb-header { 
    font-size: 24px !important; 
    margin-bottom: 16px !important; 
    text-align: center !important; 
  }

  .pipeline-col h2, .cb-content-title, #tab-data h2 {
    font-size: 22px !important; /* Fix for huge "Let's start with a link" */
    line-height: 1.3 !important;
    text-align: center !important; /* Centers the titles */
    margin-bottom: 12px !important;
  }
  
  .pipeline-col p, .cb-content-subtitle, #tab-data p {
    font-size: 14px !important;
    text-align: center !important; /* Centers the subtitles */
    margin-bottom: 24px !important;
  }

  /* Keeps the input labels aligned to the left */
  .cb-label, .qs-label {
      text-align: left !important; 
  }

  /* Layout: vertical stack */
  .cb-layout { flex-direction: column; gap: 16px; width: 100%; }

  /* Sidebar → horizontal scrollable pill row */
  .cb-sidebar {
    width: 100%;
    flex-direction: row;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    position: static; 
    gap: 8px;
    padding-bottom: 8px;
    scrollbar-width: none; 
  }
  .cb-sidebar::-webkit-scrollbar { display: none; }
  
  .cb-tab {
    flex-shrink: 0;
    padding: 10px 16px;
    font-size: 13px;
    white-space: nowrap;
    border-radius: 50px; 
    background: rgba(0, 0, 0, 0.03); 
    border: 1px solid rgba(0,0,0,0.05);
  }
  
  .cb-tab.active {
      background: rgba(232, 114, 42, 0.1);
      border-color: rgba(232, 114, 42, 0.3);
  }

  /* Content area */
  .cb-content { min-height: unset; width: 100%; }
  .lg { width: 100% !important; margin: 0 !important; }
  
  /* Reset Card Padding */
  .lg .lg-c.pipeline-card-body { 
      padding: 24px 16px !important; 
      width: 100% !important; 
  }

  /* ── Tab: Quick Start ── */
  #tab-quickstart > div {
    flex-direction: column !important;
    gap: 20px !important;
    width: 100% !important;
  }
  #tab-quickstart > div > div {
    min-width: 0 !important; 
    width: 100% !important;
  }
  #tab-quickstart > div > div:last-child {
    display: none !important;
  }
  #tab-quickstart .qs-input-wrapper { margin-bottom: 16px; width: 100%; }
  #quick_url, #quick_usecase { font-size: 16px; width: 100%; } 
  #tab-quickstart .btn-train { width: 100%; text-align: center; }

  /* ── Tab: Knowledge Base ── */
  .source-header { padding: 14px 0; }
  .source-title-group { font-size: 14px; }

  /* ── Tab: UI (Agent appearance) ── */
  .ui-layout-split { flex-direction: column; gap: 24px; width: 100%; }
  .ui-settings-col,
  .ui-preview-col { min-width: 0 !important; width: 100% !important; }
  .ui-preview-col { padding: 16px; border-radius: 16px; }
  .mock-chat-widget { max-width: 100%; }

  .ui-settings-col > div[style*="grid"] {
    display: flex !important;
    flex-direction: column !important;
    gap: 14px !important;
  }

  /* ── Tab: Settings (Lead Conventions) ── */
  #tab-settings > div[style*="grid"] {
    display: flex !important;
    flex-direction: column !important;
    gap: 16px !important;
  }

  /* Custom field rows */
  #custom-fields-container > div {
    flex-wrap: wrap !important;
    gap: 8px !important;
  }
  #custom-fields-container > div > div:first-child { flex: 1 1 100% !important; }
  #custom-fields-container > div > div:nth-child(2) { flex: 1 1 calc(50% - 4px) !important; }

  #system_prompt { font-size: 16px; width: 100%; }

  /* Bottom action bars */
  .cb-bottom-bar {
    flex-direction: column;
    gap: 12px;
    align-items: stretch;
  }
  .cb-bottom-bar .btn,
  .cb-bottom-bar .btn-train {
    width: 100%;
    text-align: center;
    justify-content: center;
  }

  /* ── Modals → bottom sheet on mobile ── */
  .cb-modal-overlay {
    padding: 0 !important;
    align-items: flex-end !important;
  }
  .cb-modal-container {
    max-width: 100% !important;
    width: 100% !important;
    border-radius: 20px 20px 0 0 !important;
    max-height: 90vh !important;
    transform: translateY(40px);
  }
  .cb-modal-overlay.active .cb-modal-container {
    transform: translateY(0);
  }
  .cb-modal-close-top { top: 14px; right: 14px; }
  .cb-modal-header { padding: 24px 20px 14px 20px; }
  .cb-modal-header h2 { font-size: 20px !important; }
  .cb-modal-header p { font-size: 13px !important; }
  .cb-modal-body { padding: 0 20px 16px 20px; }
  .cb-modal-footer { padding: 16px 20px 32px 20px; }

  .cb-dropzone { padding: 36px 16px; }

  #modal-links .cb-box-content > div > div[style*="grid"] {
    display: flex !important;
    flex-direction: column !important;
    gap: 10px !important;
  }

  /* Inputs sizing fix */
  .qs-input, .dash-input, #snippet_title, #snippet_text, #scrape_url, #qa_input, #bot_name { 
      font-size: 16px; 
      width: 100%;
  }

  /* ── Terminal overlay → bottom sheet ── */
  #log-overlay {
    padding: 0 !important;
    align-items: flex-end !important;
  }
  .terminal-container {
    max-width: 100% !important;
    width: 100% !important;
    height: 65vh !important;
    border-radius: 16px 16px 0 0 !important;
  }

  .chatbase-file-row { padding: 12px 4px; }
  .pipeline-col { min-width: 100% !important; }
  .f-graphic-container svg { width: 100% !important; height: auto !important; }
}

/* Tablet: slightly tighter */
@media (max-width: 500px) {
  .cb-box-content { padding: 14px; }
  .cb-box-header { padding: 12px 14px; font-size: 14px; }
  .btn-modal-action { width: 100%; text-align: center; }
  .cb-modal-footer { justify-content: stretch; }
}
</style>
<script>
  window.LEAD_TIMING = "{{ bot.lead_capture_timing if bot and bot.lead_capture_timing else session.get('lead_capture_timing', 'disabled') }}";
  window.EMBEDDED_BOT_ID = "{{ bot.id if bot else session.get('active_bot_id', '') }}";
  
  // Safely extract the JSON, fallback to empty array, and prevent HTML encoding
  {% set fields_json = bot.custom_form_fields if bot and bot.custom_form_fields else session.get('custom_form_fields', '[]') %}
  window.CUSTOM_FIELDS = `{{ fields_json | safe }}`;
  
  // Extra failsafe in case Python passes an empty string
  if (!window.CUSTOM_FIELDS || window.CUSTOM_FIELDS.trim() === "None" || window.CUSTOM_FIELDS.trim() === "") {
      window.CUSTOM_FIELDS = "[]";
  }
</script>
