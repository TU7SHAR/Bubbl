<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Expired | Bubbl</title>
    <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fdf8f4 0%, #f0f4ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .expired-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            max-width: 420px;
        }
        .expired-icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; margin-bottom: 8px; color: #1a1a1a; }
        p { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 20px; }
        a { display: inline-block; padding: 10px 20px; background: #E8722A; color: #fff; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 13px; }
        a:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(232,114,42,0.3); }
    </style>
</head>
<body>
    <div class="expired-card">
        <div class="expired-icon">⏰</div>
        <h1>This link has expired</h1>
        <p>Shared conversations are available for 30 days. This one is no longer accessible.</p>
        <a href="https://bubbl.ooo">Visit Bubbl.ooo</a>
    </div>
</body>
</html>
