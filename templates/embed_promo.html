<!doctype html>
<html lang="en" data-theme="{{ request.args.get('theme', '') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Bubbl — AI Chatbots</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       WIDGET PROMO v3 — Matches the Bubbl brand identity.
       
       Goals:
       - Medium-sized card (not tiny, not a full page slab)
       - FUN, playful — uses the Bubbl mascot + brand colours
       - Copy that makes you want to build a bot
       - Outfit font, pill buttons, warm orange energy
       - Transparent body, self-sizing iframe
       ═══════════════════════════════════════════════════════ */

    :root {
      --accent: #E8722A;
      --accent-glow: rgba(232, 114, 42, 0.25);
      --accent-hover: #d4621f;
      --surface: rgba(255, 255, 255, 0.92);
      --surface-solid: #ffffff;
      --border: rgba(17, 17, 17, 0.07);
      --text: #1c1004;
      --text-mid: #5a4a35;
      --muted: #8a7a66;
      --chat-bg: rgba(245, 240, 235, 0.7);
      --shadow: 0 20px 60px rgba(28, 16, 4, 0.12), 0 4px 12px rgba(28, 16, 4, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: rgba(28, 24, 20, 0.94);
        --surface-solid: #1c1814;
        --border: rgba(255, 255, 255, 0.08);
        --text: #faf6f2;
        --text-mid: #c8b8a8;
        --muted: #9a8a7a;
        --chat-bg: rgba(40, 34, 28, 0.7);
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 4px 12px rgba(0, 0, 0, 0.3);
      }
    }
    html[data-theme="light"] {
      --surface: rgba(255, 255, 255, 0.92);
      --surface-solid: #ffffff;
      --border: rgba(17, 17, 17, 0.07);
      --text: #1c1004;
      --text-mid: #5a4a35;
      --muted: #8a7a66;
      --chat-bg: rgba(245, 240, 235, 0.7);
      --shadow: 0 20px 60px rgba(28, 16, 4, 0.12), 0 4px 12px rgba(28, 16, 4, 0.06);
    }
    html[data-theme="dark"] {
      --surface: rgba(28, 24, 20, 0.94);
      --surface-solid: #1c1814;
      --border: rgba(255, 255, 255, 0.08);
      --text: #faf6f2;
      --text-mid: #c8b8a8;
      --muted: #9a8a7a;
      --chat-bg: rgba(40, 34, 28, 0.7);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent !important;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── CARD ────────────────────────────────── */
    .promo {
      position: relative;
      width: 370px;
      background: var(--surface);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to   { opacity: 1; transform: none; }
    }

    /* ── CLOSE ───────────────────────────────── */
    .close {
      position: absolute;
      top: 12px; right: 12px;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.15s, background 0.15s;
      z-index: 10;
    }
    .close:hover { opacity: 1; background: var(--chat-bg); }
    .close svg { width: 14px; height: 14px; }

    /* ── MASCOT AREA ─────────────────────────── */
    .mascot-area {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 20px 20px 0;
      min-height: 130px;
    }
    .mascot-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 260px 120px at 50% 90%, var(--accent-glow), transparent);
      pointer-events: none;
    }
    .mascot {
      width: 160px;
      height: 100px;
      background: url('/static/images/sprite-mobile.webp') center bottom / contain no-repeat;
      animation: bounce 2.5s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    /* Speech bubble from the mascot */
    .speech {
      position: absolute;
      top: 14px; right: 24px;
      background: var(--accent);
      color: #fff;
      font-size: 11.5px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 12px 12px 4px 12px;
      box-shadow: 0 4px 14px rgba(232, 114, 42, 0.3);
      animation: pop 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;
      white-space: nowrap;
    }
    .speech::after {
      content: '';
      position: absolute;
      bottom: -5px; left: 14px;
      width: 10px; height: 10px;
      background: var(--accent);
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.8) translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── CONTENT ──────────────────────────────── */
    .content {
      padding: 20px 24px 22px;
    }
    .headline {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .headline span {
      color: var(--accent);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.55;
      margin-bottom: 20px;
    }

    /* ── FEATURE PILLS ────────────────────────── */
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      background: var(--chat-bg);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-mid);
    }
    .pill svg {
      width: 13px; height: 13px;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* ── CTA ──────────────────────────────────── */
    .cta {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 24px;
      background: var(--accent);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 100px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(232, 114, 42, 0.35);
      transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
    }
    .cta:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(232, 114, 42, 0.45);
    }
    .cta:active { transform: translateY(0); }
    .cta svg {
      width: 16px; height: 16px;
      transition: transform 0.18s;
    }
    .cta:hover svg { transform: translateX(3px); }
    /* Shimmer */
    .cta::after {
      content: '';
      position: absolute;
      top: 0; left: -70%;
      width: 50%; height: 100%;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,0.25), transparent);
      transform: skewX(-20deg);
      animation: shimmer 4s ease-in-out 1.5s infinite;
    }
    @keyframes shimmer {
      0%        { left: -70%; }
      35%, 100% { left: 130%; }
    }

    /* ── FOOTER ───────────────────────────────── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 0 0;
      font-size: 11px;
      color: var(--muted);
    }
    .footer b { color: var(--text-mid); font-weight: 700; }
    .footer .dot { opacity: 0.35; }

    /* ── RESPONSIVE ───────────────────────────── */
    @media (max-width: 400px) {
      body { padding: 10px; }
      .promo { width: 100%; }
      .headline { font-size: 19px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="promo" role="complementary" aria-label="Bubbl advertisement">
    <button class="close" type="button" aria-label="Dismiss">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"></path>
      </svg>
    </button>

    <div class="mascot-area">
      <div class="mascot" aria-hidden="true"></div>
      <div class="speech">Hey! Need a chatbot? 👋</div>
    </div>

    <div class="content">
      <h1 class="headline">Your own <span>AI agent</span>,<br>live in 5 minutes</h1>
      <p class="subtitle">
        Train it on your website, docs, or any text. It answers your customers 24/7, captures leads, and sounds exactly like you.
      </p>

      <div class="features">
        <span class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          Instant setup
        </span>
        <span class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Free plan
        </span>
        <span class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
          No code needed
        </span>
      </div>

      <a class="cta" href="https://bubbl.ooo?ref=widget-promo&utm_source=widget&utm_medium=promo" target="_blank" rel="noopener">
        Build your bot — it's free
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"></path>
        </svg>
      </a>

      <div class="footer">
        Powered by <b>Bubbl.ooo</b> <span class="dot">•</span> No credit card
      </div>
    </div>
  </div>

  <script>
    (function () {
      var card = document.querySelector('.promo');

      function reportSize() {
        var pad = parseFloat(getComputedStyle(document.body).paddingLeft) || 14;
        try {
          parent.postMessage({
            type: 'bubbl:promo',
            width: Math.ceil(card.offsetWidth + pad * 2),
            height: Math.ceil(card.offsetHeight + pad * 2)
          }, '*');
        } catch (e) {}
      }

      if (document.readyState === 'complete') reportSize();
      else window.addEventListener('load', reportSize);
      card.addEventListener('animationend', reportSize);
      if (window.ResizeObserver) {
        new ResizeObserver(reportSize).observe(card);
      } else {
        setTimeout(reportSize, 700);
      }

      document.querySelector('.close').addEventListener('click', function () {
        card.style.transition = 'opacity .25s, transform .25s';
        card.style.opacity = '0';
        card.style.transform = 'translateY(12px) scale(.96)';
        setTimeout(function () {
          try { parent.postMessage({ type: 'bubbl:promo-dismiss' }, '*'); } catch (e) {}
        }, 250);
      });
    })();
  </script>
</body>
</html>
