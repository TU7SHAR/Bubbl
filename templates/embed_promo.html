<!doctype html>
<html lang="en" data-theme="{{ request.args.get('theme', '') }}" data-mobile="{{ '1' if request.args.get('mobile') == '1' else '0' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Bubbl</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════
       WIDGET PROMO v4 — "The widget IS the ad"
       
       Concept: Looks like an actual Bubbl chat widget already 
       running on the host's site. A realistic conversation types
       out, then reveals "This could be on YOUR site" with CTA.
       
       The visitor thinks: "Wait, that bot is slick — I want one."
       ═══════════════════════════════════════════════════════════ */

    /* BRAND — identical on every host site, light or dark. The Bubbl orange is
       the one constant so the ad is recognisably ours anywhere; only the
       surface/text tokens below adapt to the page it's sitting on. */
    :root {
      --accent: #E8722A;
      --accent-hover: #d4621f;
      --accent-text: #ffffff;

      --bg: #ffffff;
      --bg-chat: #f8f5f2;
      --header: #1c1004;
      --text: #1c1004;
      --text-soft: #5a4a35;
      --muted: #9a8a7a;
      --border: rgba(28, 16, 4, 0.08);
      --user-bubble: var(--accent);
      --user-text: #ffffff;
      --bot-bubble: #ffffff;
      --bot-text: #1c1004;
      --bot-border: rgba(28, 16, 4, 0.1);
      --shadow: 0 25px 80px rgba(28, 16, 4, 0.18), 0 8px 24px rgba(28, 16, 4, 0.08);
      --input-bg: #ffffff;
      --input-border: rgba(28, 16, 4, 0.12);
      --cta-glow: rgba(232, 114, 42, 0.4);
      --overlay: rgba(255, 255, 255, 0.92);
    }

    @media (prefers-color-scheme: dark) { :root {
      --bg: #1a1714;
      --bg-chat: #211e1a;
      --header: #faf6f2;
      --text: #faf6f2;
      --text-soft: #c8b8a8;
      --muted: #7a6e62;
      --border: rgba(255, 255, 255, 0.07);
      --user-bubble: var(--accent);
      --user-text: #ffffff;
      --bot-bubble: #2a2520;
      --bot-text: #f0ebe6;
      --bot-border: rgba(255, 255, 255, 0.08);
      --shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 8px 24px rgba(0, 0, 0, 0.3);
      --input-bg: #2a2520;
      --input-border: rgba(255, 255, 255, 0.1);
      --cta-glow: rgba(232, 114, 42, 0.5);
      --overlay: rgba(26, 23, 20, 0.94);
    }}
    html[data-theme="light"] {
      --bg: #ffffff; --bg-chat: #f8f5f2; --header: #1c1004;
      --text: #1c1004; --text-soft: #5a4a35; --muted: #9a8a7a;
      --border: rgba(28, 16, 4, 0.08); --bot-bubble: #ffffff;
      --bot-text: #1c1004; --bot-border: rgba(28, 16, 4, 0.1);
      --shadow: 0 25px 80px rgba(28, 16, 4, 0.18), 0 8px 24px rgba(28, 16, 4, 0.08);
      --input-bg: #ffffff; --input-border: rgba(28, 16, 4, 0.12);
      --overlay: rgba(255, 255, 255, 0.92);
    }
    html[data-theme="dark"] {
      --bg: #1a1714; --bg-chat: #211e1a; --header: #faf6f2;
      --text: #faf6f2; --text-soft: #c8b8a8; --muted: #7a6e62;
      --border: rgba(255, 255, 255, 0.07); --bot-bubble: #2a2520;
      --bot-text: #f0ebe6; --bot-border: rgba(255, 255, 255, 0.08);
      --shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 8px 24px rgba(0, 0, 0, 0.3);
      --input-bg: #2a2520; --input-border: rgba(255, 255, 255, 0.1);
      --overlay: rgba(26, 23, 20, 0.94);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent !important;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 12px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── WIDGET SHELL ────────────────────────── */
    .widget {
      width: 380px;
      height: 520px;
      /* Never let the iframe box shrink us: offsetWidth/Height are what we
         report back for iframe sizing, so a shrunken element would lock the
         iframe small permanently (it could collapse but never re-expand). */
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
      animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }

    /* ── HEADER ───────────────────────────────── */
    .w-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .w-avatar {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 10px rgba(232, 114, 42, 0.3);
      flex-shrink: 0;
    }
    .w-avatar svg { width: 18px; height: 18px; }
    .w-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--header);
    }
    .w-status {
      font-size: 11px;
      color: #22c55e;
      font-weight: 500;
      display: flex; align-items: center; gap: 4px;
    }
    .w-status::before {
      content: '';
      width: 6px; height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── CHAT AREA ────────────────────────────── */
    .w-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      background: var(--bg-chat);
      overflow: hidden;
    }

    .msg {
      max-width: 82%;
      padding: 10px 14px;
      font-size: 13.5px;
      line-height: 1.5;
      border-radius: 16px;
      opacity: 0;
      transform: translateY(8px);
    }
    .msg.show {
      animation: msgIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes msgIn {
      to { opacity: 1; transform: none; }
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: var(--user-text);
      border-radius: 16px 16px 4px 16px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      color: var(--bot-text);
      border: 1px solid var(--bot-border);
      border-radius: 16px 16px 16px 4px;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
      align-self: flex-start;
      background: var(--bot-bubble);
      border: 1px solid var(--bot-border);
      border-radius: 16px 16px 16px 4px;
      opacity: 0;
    }
    .typing.show { animation: msgIn 0.3s forwards; }
    .typing.hide { animation: msgOut 0.2s forwards; }
    @keyframes msgOut { to { opacity: 0; transform: translateY(-4px); } }
    .typing i {
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce-dot 1.2s ease-in-out infinite;
    }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce-dot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* ── FAKE INPUT BAR ───────────────────────── */
    .w-input {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .w-input-field {
      flex: 1;
      padding: 10px 14px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 100px;
      font-size: 13px;
      color: var(--muted);
      font-family: inherit;
    }
    .w-input-send {
      width: 36px; height: 36px;
      background: var(--user-bubble);
      border: 0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.7;
    }
    .w-input-send svg { width: 16px; height: 16px; color: #fff; }

    /* ── CTA OVERLAY ──────────────────────────── */
    .cta-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: var(--overlay);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      text-align: center;
      border-radius: 20px;
    }
    .cta-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .cta-mascot {
      width: 120px;
      height: 80px;
      background: url('/static/images/sprite-mobile.webp') center bottom / contain no-repeat;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .cta-headline {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .cta-headline span { color: var(--accent); }
    .cta-sub {
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.5;
      margin-bottom: 24px;
      max-width: 280px;
    }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 15px 32px;
      background: var(--accent);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 100px;
      box-shadow: 0 8px 28px var(--cta-glow);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .cta-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 36px var(--cta-glow);
    }
    .cta-btn:active { transform: scale(0.98); }
    .cta-btn svg { width: 16px; height: 16px; transition: transform 0.2s; }
    .cta-btn:hover svg { transform: translateX(3px); }
    .cta-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -80%;
      width: 60%; height: 100%;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: skewX(-20deg);
      animation: shine 3.5s ease-in-out 0.5s infinite;
    }
    @keyframes shine {
      0% { left: -80%; }
      30%, 100% { left: 140%; }
    }
    .cta-foot {
      margin-top: 14px;
      font-size: 11.5px;
      color: var(--muted);
    }
    .cta-foot b { color: var(--text-soft); }

    /* ── DISMISS ──────────────────────────────── */
    .close-btn {
      position: absolute;
      top: 12px; right: 12px;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      background: var(--border);
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      cursor: pointer;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .close-btn.show { opacity: 0.7; }
    .close-btn:hover { opacity: 1; }
    .close-btn svg { width: 13px; height: 13px; }

    /* ── MASCOT LAUNCHER ──────────────────────────
       Closing the promo collapses to the mascot, exactly like the real
       widget does — it never fully disappears, so the visitor can bring
       it back. Clicking the mascot re-opens the demo. */
    .launcher {
      display: none;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: flex-end;
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .launcher.show {
      display: flex;
      animation: launcherIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes launcherIn {
      from { opacity: 0; transform: translateY(14px) scale(0.9); }
      to   { opacity: 1; transform: none; }
    }
    /* Little "psst, come back" bubble above the mascot */
    .launcher-tip {
      align-self: center;
      margin-bottom: 2px;
      padding: 7px 13px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      border-radius: 14px 14px 14px 4px;
      box-shadow: 0 4px 16px rgba(232, 114, 42, 0.35);
      animation: tipFloat 3s ease-in-out infinite;
    }
    @keyframes tipFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }
    .launcher-mascot {
      width: 190px;
      height: 108px;
      background: url('/static/images/sprite-mobile.webp') center bottom / contain no-repeat;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .launcher:hover .launcher-mascot { transform: scale(1.06) translateY(-3px); }
    .launcher:active .launcher-mascot { transform: scale(0.98); }

    /* ── RESPONSIVE ─────────────────────────────
       Driven by data-mobile from embed.js (the HOST page's viewport), NOT by
       a @media query on our own width.

       Why: the iframe is resized to fit whatever we report. When collapsed to
       the mascot the iframe becomes ~166px wide, so a `max-width: 420px` media
       query would match and set `.widget { width: 100% }` — reporting the
       collapsed width as the widget's width and locking the iframe small
       forever. The iframe width decided the media query, and the media query
       decided the reported width. Keying off the host viewport breaks the loop. */
    html[data-mobile="1"] body { padding: 8px; }
    html[data-mobile="1"] .widget { width: 100%; height: 480px; }
    html[data-mobile="1"] .cta-headline { font-size: 20px; }
    html[data-mobile="1"] .launcher-mascot { width: 150px; height: 88px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="widget" style="position:relative;">
    <button class="close-btn" type="button" aria-label="Dismiss">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"></path>
      </svg>
    </button>

    <!-- Fake widget header -->
    <div class="w-header">
      <div class="w-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </div>
      <div>
        <div class="w-name">Bubbl AI</div>
        <div class="w-status">Online now</div>
      </div>
    </div>

    <!-- Chat messages (typed out via JS) -->
    <div class="w-chat" id="chat">
      <div class="typing" id="typing"><i></i><i></i><i></i></div>
    </div>

    <!-- Fake input -->
    <div class="w-input">
      <div class="w-input-field">Ask anything...</div>
      <div class="w-input-send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
        </svg>
      </div>
    </div>

    <!-- CTA overlay (appears after the conversation) -->
    <div class="cta-overlay" id="cta">
      <div class="cta-mascot" aria-hidden="true"></div>
      <div class="cta-headline">Want this on <span>your</span> site?</div>
      <p class="cta-sub">Build your own AI chatbot in 5 minutes. Trained on your content, speaks your brand.</p>
      <a class="cta-btn" href="https://bubbl.ooo?ref=widget-promo&utm_source=widget&utm_medium=embed-promo" target="_blank" rel="noopener">
        Start for free
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"></path>
        </svg>
      </a>
      <div class="cta-foot">No credit card needed · Powered by <b>Bubbl.ooo</b></div>
    </div>
  </div>

  <!-- Collapsed state: the mascot, same as the real widget's launcher -->
  <button class="launcher" type="button" aria-label="Open Bubbl">
    <span class="launcher-tip">Get your own bot</span>
    <span class="launcher-mascot" aria-hidden="true"></span>
  </button>

  <script>
  (function () {
    var chat = document.getElementById('chat');
    var typing = document.getElementById('typing');
    var cta = document.getElementById('cta');
    var closeBtn = document.querySelector('.close-btn');
    var widget = document.querySelector('.widget');

    // The "conversation" that plays out
    var script = [
      { role: 'bot', text: "Hey there! 👋 I'm an AI assistant. How can I help you today?" },
      { delay: 900, role: 'user', text: "What can you do?" },
      { role: 'bot', text: "I can answer questions about your business, book meetings, capture leads, and help customers 24/7 — all trained on your own data." },
      { delay: 800, role: 'user', text: "That's cool. How fast to set up?" },
      { role: 'bot', text: "Under 5 minutes! Just paste your website URL, customize the look, and embed one line of code. Done. 🚀" }
    ];

    var msgIndex = 0;

    function showTyping() {
      typing.classList.remove('hide');
      typing.classList.add('show');
    }
    function hideTyping() {
      typing.classList.remove('show');
      typing.classList.add('hide');
    }

    function addMessage(role, text) {
      var el = document.createElement('div');
      el.className = 'msg ' + role;
      el.textContent = text;
      chat.insertBefore(el, typing);
      // Trigger animation
      requestAnimationFrame(function () { el.classList.add('show'); });
      // Scroll to bottom
      chat.scrollTop = chat.scrollHeight;
    }

    function playNext() {
      if (msgIndex >= script.length) {
        // Conversation done — show CTA
        hideTyping();
        setTimeout(function () {
          cta.classList.add('show');
          closeBtn.classList.add('show');
        }, 600);
        return;
      }

      var item = script[msgIndex];
      var delay = item.delay || 400;
      msgIndex++;

      if (item.role === 'user') {
        setTimeout(function () {
          addMessage('user', item.text);
          setTimeout(playNext, 400);
        }, delay);
      } else {
        // Bot: show typing first, then message
        setTimeout(function () {
          showTyping();
          chat.scrollTop = chat.scrollHeight;
          var typeTime = Math.min(900, item.text.length * 16);
          setTimeout(function () {
            hideTyping();
            setTimeout(function () {
              addMessage('bot', item.text);
              setTimeout(playNext, 300);
            }, 150);
          }, typeTime);
        }, delay);
      }
    }

    // Start the conversation after a brief pause
    setTimeout(playNext, 600);

    // ── SIZE REPORTING ──────────────────────────────────────────
    // The iframe is a fixed 450x800 and would swallow clicks across that whole
    // corner of the host page, so we tell embed.js the size of whichever
    // element is currently visible (the demo widget, or the mascot launcher).
    var launcher = document.querySelector('.launcher');

    function activeElement() {
      return launcher.classList.contains('show') ? launcher : widget;
    }

    function reportSize() {
      var el = activeElement();
      var pad = parseFloat(getComputedStyle(document.body).paddingLeft) || 12;
      try {
        parent.postMessage({
          type: 'bubbl:promo',
          // offsetWidth/Height are layout sizes and ignore CSS transforms, so
          // an in-flight entrance animation can't report a too-small box.
          width: Math.ceil(el.offsetWidth + pad * 2),
          height: Math.ceil(el.offsetHeight + pad * 2)
        }, '*');
      } catch (e) {}
    }

    if (document.readyState === 'complete') reportSize();
    else window.addEventListener('load', reportSize);
    widget.addEventListener('animationend', reportSize);
    launcher.addEventListener('animationend', reportSize);
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(reportSize);
      ro.observe(widget);
      ro.observe(launcher);
    } else {
      setTimeout(reportSize, 700);
    }

    // ── COLLAPSE / REOPEN ───────────────────────────────────────
    // Closing does NOT remove the widget — it collapses to the mascot, the
    // same affordance the real chat widget uses. The ad stays available
    // instead of being gone for good after one stray click.
    function collapse() {
      widget.style.transition = 'opacity .25s, transform .25s';
      widget.style.opacity = '0';
      widget.style.transform = 'translateY(14px) scale(.95)';
      setTimeout(function () {
        widget.style.display = 'none';
        launcher.classList.add('show');
        reportSize();
      }, 250);
    }

    function expand() {
      launcher.classList.remove('show');
      widget.style.display = 'flex';
      widget.style.opacity = '';
      widget.style.transform = '';
      widget.style.transition = '';
      // Replay the entrance animation
      widget.style.animation = 'none';
      void widget.offsetWidth;
      widget.style.animation = '';
      reportSize();
    }

    closeBtn.addEventListener('click', collapse);
    launcher.addEventListener('click', expand);
  })();
  </script>
</body>
</html>
