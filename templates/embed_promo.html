<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubbl.ooo</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: linear-gradient(135deg, #fff8f2 0%, #fef3eb 100%);
    }
    .promo-card {
      text-align: center;
      max-width: 300px;
      padding: 40px 28px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid rgba(232,114,42,0.15);
      box-shadow: 0 16px 48px rgba(232,114,42,0.08);
    }
    .promo-icon {
      width: 56px; height: 56px; margin: 0 auto 16px;
      background: #E8722A; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(232,114,42,0.25);
    }
    .promo-icon svg { width: 28px; height: 28px; }
    h1 {
      font-size: 18px; font-weight: 800; color: #1a1a1a;
      margin-bottom: 8px; line-height: 1.3;
    }
    p {
      font-size: 13px; color: #6b7280; line-height: 1.5;
      margin-bottom: 20px;
    }
    .promo-cta {
      display: inline-block; padding: 12px 24px;
      background: #E8722A; color: #fff;
      font-size: 13px; font-weight: 700;
      border-radius: 50px; text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(232,114,42,0.3);
    }
    .promo-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(232,114,42,0.4);
    }
    .promo-footer {
      margin-top: 16px; font-size: 11px; color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="promo-card">
    <div class="promo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </div>
    <h1>Want an AI Chatbot?</h1>
    <p>Create your own custom AI agent trained on your data. Embed it anywhere in minutes.</p>
    <a href="https://bubbl.ooo?ref=widget-promo" target="_blank" class="promo-cta">
      Get Your Bot on Bubbl.ooo
    </a>
    <div class="promo-footer">Powered by Bubbl</div>
  </div>
</body>
</html>
